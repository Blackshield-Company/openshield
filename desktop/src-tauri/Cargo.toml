[package]
name = "openshark-desktop"
version = "0.3.0"
description = "Standalone desktop GUI for OpenShark"
authors = ["synth"]
license = "MIT"
edition = "2021"

[lib]
name = "openshark_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
which = "8"
tokio = { version = "1", features = ["process", "io-util"] }

[profile.release]
opt-level = 3
lto = true
strip = true
