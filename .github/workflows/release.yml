name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            notes=$(awk -v v="${TAG#v}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md)
            gh release create "$TAG" --title "OpenShield $TAG" --notes "${notes:-Release $TAG}" --verify-tag
          fi

  build:
    needs: create-release
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --features gateways
      # Archive names must match install.sh: openshield-<target>.tar.gz / .zip
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="openshield-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/openshield" README.md LICENSE CHANGELOG.md "dist/$name/"
          tar -C dist -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "ASSETS=$name.tar.gz $name.tar.gz.sha256" >> "$GITHUB_ENV"
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          name="openshield-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/openshield.exe" README.md LICENSE CHANGELOG.md "dist/$name/"
          (cd dist && 7z a -tzip "../$name.zip" "$name" > /dev/null)
          sha256sum "$name.zip" > "$name.zip.sha256"
          echo "ASSETS=$name.zip $name.zip.sha256" >> "$GITHUB_ENV"
      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" $ASSETS --clobber

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir sums && cd sums
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.sha256'
          cat *.sha256 | sed 's/ \*/  /' | sort -k2 > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" SHA256SUMS --clobber
