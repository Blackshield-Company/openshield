<!doctype html>
<html><head><meta charset="utf-8"><title>OpenShield demo</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
<style>html,body{margin:0;height:100%;background:#0b0b0d}#t{height:100%}</style></head>
<body><div id="t"></div>
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
<script>
const term = new Terminal({cursorBlink: true, theme: {background: '#0b0b0d', foreground: '#d8d8d8', cursor: '#c1121f'}});
const fit = new FitAddon.FitAddon(); term.loadAddon(fit); term.open(document.getElementById('t')); fit.fit();
const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
ws.binaryType = 'arraybuffer';
const resize = () => { fit.fit(); if (ws.readyState === 1) ws.send(JSON.stringify({type: 'resize', cols: term.cols, rows: term.rows})); };
ws.onopen = resize;
ws.onmessage = e => term.write(typeof e.data === 'string' ? e.data : new Uint8Array(e.data));
ws.onclose = () => term.write('\r\n[session ended — reload to restart]\r\n');
term.onData(d => ws.readyState === 1 && ws.send(JSON.stringify({type: 'input', data: d})));
window.addEventListener('resize', resize);
</script></body></html>
